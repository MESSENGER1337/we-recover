<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>We Recover - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="eink-flash" id="einkFlash"></div>

<header id="site-bar" class="minimal-bar">
  <div class="bar-inner">
    <div class="bar-compact" id="barCompact" style="display: flex;">
      <button class="burger" id="burgerBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a href="index.html" class="compact-title" style="text-decoration:none;">WE RECOVER</a>
    </div>
  </div>
</header>

<div id="bar-spacer"></div>

<div class="overlay" id="overlay"></div>
<aside class="burger-panel" id="burgerPanel" aria-label="Site menu">
  <p class="bp-title"><a href="index.html" style="text-decoration:none; color:inherit;">WE RECOVER</a></p>

  <div class="bp-section">
    <p class="bp-label">LOCATION</p>
    <div class="bp-select-row">
      <select class="ink-select" id="stateSelectMobile" aria-label="Select your state"></select>
    </div>
  </div>

  <!-- Dynamic Container for Account & Navigation -->
  <div class="bp-section" id="bpAccountNav"></div>

  <!-- Dynamic Container for Categories -->
  <div class="bp-section" id="bpCategories"></div>
</aside>

<main>
  <div class="blank-page" style="max-width: 440px;">
    <h2>Login</h2>
    <p>Sign in to sync your saved items across devices.</p>
    
    <form class="neo-raised" style="padding: 1.8rem; text-align: left;" onsubmit="event.preventDefault();">
      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem;">Email</label>
        <input type="email" placeholder="name@example.com" style="width: 100%; padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--paper);" required>
      </div>
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
        <input type="password" style="width: 100%; padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--paper);" required>
      </div>
      <button type="submit" class="neo-btn ink-btn" style="width: 100%; justify-content: center;">Sign In</button>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-links" aria-label="Footer Navigation">
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact Us</a>
      <a href="get-involved.html">Get Involved</a>
    </nav>
    <p class="footer-credit">Est. 2026 Messenger Media</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
